<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="product.html">Products</a>
            <a href="#">Categories</a>
            <a href="#">Offers</a>
        </nav>

        <div class="nav-actions">
            <input type="text" placeholder="Search products...">
            <button>Login</button>
        <button onclick="goToCart()">

    🛒 Cart
    (<span id="cartCount">0</span>)

        </button>
        </div>

    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Shop Smart. Live Better.</h1>

            <p>
                Discover amazing products at the best prices.
            </p>

            <button class="shop-btn">
                Shop Now
            </button>

        </div>

    </section>


    <!-- Categories -->
   
<section class="section">

    <h2>Shop by Category</h2>

    <div class="categories">

        <div class="category"
             onclick="filterCategory('Electronics')">
            💻
            <h3>Electronics</h3>
        </div>

        <div class="category"
             onclick="filterCategory('Fashion')">
            👕
            <h3>Fashion</h3>
        </div>

        <div class="category"
             onclick="filterCategory('Furniture')">
            🪑
            <h3>Furniture</h3>
        </div>

        <div class="category"
             onclick="filterCategory('Mobiles')">
            📱
            <h3>Mobiles</h3>
        </div>

    </div>

</section>

    <!-- Products -->
    <section class="section">

    <h2>Featured Products</h2>

    <div class="products" id="productContainer">

        <!-- Products will be displayed using JavaScript -->

    </div>         

    </section>


    <!-- Footer -->
    <footer>

        <h3>ShopEase</h3>

        <p>© 2026 ShopEase. All Rights Reserved.</p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
