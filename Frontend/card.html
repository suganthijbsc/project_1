<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="#">Categories</a>
            <a href="#">Offers</a>
        </nav>

        <div class="nav-actions">

            <input
                type="text"
                placeholder="Search products..."
            >

            <button>Login</button>

            <button onclick="goToCart()">

    🛒 Cart
    (<span id="cartCount">0</span>)</button>
        </div>

    </header>


    <!-- Cart -->

    <section class="cart-section">

    <h1>Shopping Cart</h1>

    <div class="cart-container">

        <!-- Dynamic Cart Items -->

        <div id="cartItems">

            <!-- Cart products will appear here -->

        </div>


        <!-- Cart Summary -->

        <div class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <span>
                    ₹<span id="subtotal">0</span>
                </span>

            </div>

            <div class="summary-row">

                <span>Delivery</span>

                <span>Free</span>

            </div>

            <hr>

            <div class="summary-total">

                <span>Total</span>

                <span>
                    ₹<span id="finalTotal">0</span>
                </span>

            </div>

            <button
                class="checkout-btn"
                onclick="goToCheckout()">

                Proceed to Checkout

            </button>

        </div>

    </div>

</section>

    <script src="js/script.js"></script>

</body>

</html>
