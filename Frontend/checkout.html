<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEase</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>

    </header>


    <!-- Checkout -->

    <section class="checkout-section">

        <h1>Checkout</h1>

        <div class="checkout-container">


            <!-- Customer Details -->

            <div class="checkout-form">

                <h2>Delivery Details</h2>

                <form onsubmit="placeOrder(event)">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your full name"
                        required
                    >


                    <label>Email</label>

                    <input
                        type="email"
                        id="customerEmail"
                        placeholder="Enter your email"
                        required
                    >


                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="Enter phone number"
                        required
                    >


                    <label>Address</label>

                    <textarea
                        id="customerAddress"
                        placeholder="Enter delivery address"
                        required>
                    </textarea>


                    <label>City</label>

                    <input
                        type="text"
                        id="customerCity"
                        placeholder="Enter city"
                        required
                    >


                    <label>Pincode</label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter pincode"
                        required
                    >


                    <h2>Payment Method</h2>

                    <div class="payment-options">

                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="Cash on Delivery"
                                checked
                            >

                            Cash on Delivery
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="UPI"
                            >

                            UPI
                        </label>


                        <label>
                            <input
                                type="radio"
                                name="payment"
                                value="Card"
                            >

                            Credit / Debit Card
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn">

                        Place Order

                    </button>

                </form>

                <p id="orderMessage"></p>

            </div>


            <!-- Order Summary -->

            <div class="checkout-summary">

                <h2>Order Summary</h2>

                <div class="checkout-product">

                    <span>
                        💻 Laptop Model 19
                    </span>

                    <span>
                        ₹65,000
                    </span>

                </div>

                <div class="summary-row">

                    <span>Quantity</span>

                    <span>1</span>

                </div>

                <div class="summary-row">

                    <span>Delivery</span>

                    <span>Free</span>

                </div>

                <hr>

                <div class="summary-total">

                    <span>Total</span>

                    <span>₹65,000</span>

                </div>

            </div>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
