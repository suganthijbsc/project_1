<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            ShopEase
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Products</a>
            <a href="#">Categories</a>
            <a href="#">Offers</a>
        </nav>

        <div class="nav-actions">

            <input
                type="text"
                placeholder="Search products..."
            >

            <button>Login</button>

            <button onclick="goToCart()">

                     🛒 Cart
                (<span id="cartCount">0</span>)
            </button>
        </div>

    </header>


    <!-- Product Details -->

    <section class="product-details">

        <!-- Product Image -->

        <div class="product-large-image">
            💻
        </div>


        <!-- Product Information -->

        <div class="product-info">

            <h1>Laptop Model 19</h1>

            <div class="rating">
                ⭐⭐⭐⭐⭐
                <span>4.8 / 5</span>
            </div>

            <h2 class="price">
                ₹65,000
            </h2>

            <p>
                High performance laptop suitable for
                business, education and professional use.
            </p>

            <p>
                <strong>Availability:</strong>
                In Stock
            </p>


            <!-- Quantity -->

            <div class="quantity">

                <h3>Quantity</h3>

                <button onclick="decreaseQuantity()">
                    -
                </button>

                <span id="quantity">
                    1
                </span>

                <button onclick="increaseQuantity()">
                    +
                </button>

            </div>


            <!-- Buttons -->

            <div class="product-buttons">

                <<button
    class="cart-btn"
    onclick="addCurrentProductToCart()">

    🛒 Add to Cart

</button>

                <button class="buy-btn">

                    Buy Now

                </button>

            </div>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
